spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${SECRET_URL}
    username: ${SECRET_USERNAME}
    password: ${SECRET_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect